# Copy of the GitHub Actions workflow to add once as .github/workflows/web-build.yml
# (see docs/DEPLOIEMENT.md). Kept here because automated tools may not create
# workflow files in this repository.

name: web-build

# Builds the online service's frontend (public/build) and publishes it on the
# branch `web-build-<branch>`, one commit holding the files and the source
# commit they were built from. The server's deploy script
# (scripts/server/deploy.sh) fetches it with the git access it already has:
# shared hosting usually has no Node.js to build there.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public/build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sodium, sqlite3, xml, xmlreader, xmlwriter, zip
          tools: composer:2.8.9
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.15.1'
          cache: npm
          cache-dependency-path: package-lock.json

      # The Vite build generates the typed route helpers with artisan.
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-ansi

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build production frontend assets
        run: npm run build

      - name: Publish on the web-build branch
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="web-build-$(printf '%s' "$SOURCE_BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          work="$(mktemp -d)"
          cp -R public/build "$work/build"
          printf '%s\n' "$SOURCE_COMMIT" > "$work/SOURCE_COMMIT"
          cd "$work"
          git init -q
          git checkout -q -b "$target"
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "web build of $SOURCE_BRANCH @ $SOURCE_COMMIT"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$target"
          echo "Published $target for $SOURCE_COMMIT"
