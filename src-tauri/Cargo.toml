[package]
name = "drclick-desktop"
version = "0.1.0"
description = "Drclick thin-client desktop shell"
authors = ["Drclick"]
edition = "2021"
rust-version = "1.84"

[lib]
name = "drclick_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Drclick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
url = "2.5"

[dependencies]
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
