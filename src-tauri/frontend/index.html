<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>DrClickDz</title>
        <style>
            /* ---------------------------------------------------------------
               Minimal offline / redirect page for the DrClickDz thin client.
               Visible only when the central server cannot be reached.
               --------------------------------------------------------------- */
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            :root {
                --accent: #0057b8;
                --bg: #f4f6f9;
                --card-bg: #ffffff;
                --text: #1a1d23;
                --muted: #6b7280;
                --border: #e2e6ed;
                --radius: 12px;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f1117;
                    --card-bg: #1a1d27;
                    --text: #e8eaf0;
                    --muted: #9ca3af;
                    --border: #2a2d3a;
                }
            }

            html, body {
                height: 100%;
                background: var(--bg);
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                color: var(--text);
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            /* Hidden by default — shown only on connectivity failure */
            .offline-card {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 48px 40px;
                max-width: 480px;
                width: 100%;
                text-align: center;
                box-shadow: 0 4px 24px rgba(0,0,0,.07);
            }

            .offline-card.visible { display: flex; }

            .mark {
                width: 56px;
                height: 56px;
                border-radius: 14px;
                background: var(--accent);
                color: #fff;
                font-size: 28px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: center;
                letter-spacing: -1px;
                flex-shrink: 0;
            }

            .eyebrow {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .08em;
                color: var(--muted);
            }

            h1 {
                font-size: 20px;
                font-weight: 700;
                line-height: 1.3;
            }

            .message {
                font-size: 15px;
                color: var(--muted);
                line-height: 1.6;
            }

            .retry-btn {
                margin-top: 8px;
                padding: 12px 28px;
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: opacity .15s;
            }

            .retry-btn:hover { opacity: .85; }
            .retry-btn:active { opacity: .7; }
            /* Connecting spinner shown during initial redirect */
            .spinner-wrap {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
            .spinner-wrap.visible { display: flex; }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite;
            }

            @keyframes spin { to { transform: rotate(360deg); } }

            .spinner-label {
                font-size: 14px;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <!-- Initial connecting state (shown briefly while navigating) -->
        <div class="spinner-wrap visible" id="spinner">
            <div class="mark">D</div>
            <div class="spinner" role="status" aria-label="Connexion en cours"></div>
            <p class="spinner-label">Connexion à DrClickDz…</p>
        </div>

        <!-- Offline error card (shown only when server is unreachable) -->
        <div class="offline-card" id="offline-card" role="alert" aria-live="assertive">
            <div class="mark" aria-hidden="true">D</div>
            <p class="eyebrow">DrClickDz</p>
            <h1>Connexion au serveur impossible</h1>
            <p class="message">
                Vérifiez votre connexion Internet puis réessayez.<br>
                Si le problème persiste, contactez le support DrClickDz.
            </p>
            <button class="retry-btn" id="retry-btn" type="button">Réessayer</button>
        </div>

        <script>
            // ---------------------------------------------------------------
            // DrClickDz thin-client redirect page
            //
            // Strategy:
            //   1. Read the server URL injected by Rust at window creation time
            //      (window.__MEDISMART_SERVER_URL).
            //   2. Probe reachability with a short fetch HEAD request.
            //   3. If reachable → navigate the webview to the server URL.
            //   4. If unreachable → show the offline card with a Retry button.
            //   5. Automatic retries use exponential backoff while the manual
            //      Retry button remains available.
            // ---------------------------------------------------------------

            (function () {
                'use strict';

                const serverUrl = window.__MEDISMART_SERVER_URL || 'https://app.medismart.dz';
                const INITIAL_DELAY_MS = 1500;
                const MAX_DELAY_MS = 30_000;
                const PROBE_TIMEOUT_MS = 8_000;

                const spinner = document.getElementById('spinner');
                const offlineCard = document.getElementById('offline-card');
                const retryBtn = document.getElementById('retry-btn');

                let retryDelay = INITIAL_DELAY_MS;
                let retryTimer = null;

                function showSpinner() {
                    spinner.classList.add('visible');
                    offlineCard.classList.remove('visible');
                }

                function showOffline() {
                    spinner.classList.remove('visible');
                    offlineCard.classList.add('visible');
                }

                function scheduleRetry() {
                    clearTimeout(retryTimer);
                    retryTimer = setTimeout(attempt, retryDelay);
                    retryDelay = Math.min(retryDelay * 2, MAX_DELAY_MS);
                }

                async function probe() {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), PROBE_TIMEOUT_MS);
                    try {
                        // A HEAD request is lightweight and avoids downloading the page body.
                        // `mode: 'no-cors'` is needed when the server does not send
                        // Access-Control-Allow-Origin; an opaque response still confirms
                        // the server is reachable.
                        await fetch(serverUrl, {
                            method: 'HEAD',
                            mode: 'no-cors',
                            signal: controller.signal,
                        });
                        return true;
                    } catch (_) {
                        return false;
                    } finally {
                        clearTimeout(timeoutId);
                    }
                }

                async function attempt() {
                    showSpinner();
                    const reachable = await probe();
                    if (reachable) {
                        // Navigate the entire webview to the server — this replaces
                        // the loader page so no cleanup needed.
                        window.location.replace(serverUrl);
                    } else {
                        showOffline();
                        scheduleRetry();
                    }
                }

                retryBtn.addEventListener('click', function () {
                    clearTimeout(retryTimer);
                    retryDelay = INITIAL_DELAY_MS;
                    attempt();
                });

                // Start immediately on page load.
                attempt();
            })();
        </script>
    </body>
</html>
