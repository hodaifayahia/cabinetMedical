name: desktop-installer-windows

# Builds the MediSmart Windows desktop installer (.msi + .exe NSIS)
# and uploads it as a workflow artifact. On tags (v*), it also attaches
# the installers to a GitHub Release.

on:
  push:
    branches:
      - main
      - feature/hosted-multi-cabinet-desktop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-installer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-win-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Prepare updater signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_KEY)) {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY secret configured - generating an ephemeral key (updater signatures will not be trusted by existing installs)."
            tauri signer generate -w $env:RUNNER_TEMP\medismart.key --password ""
            $priv = Get-Content -Raw "$env:RUNNER_TEMP\medismart.key"
            "TAURI_SIGNING_PRIVATE_KEY=$priv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "TAURI_SIGNING_PRIVATE_KEY=$env:SIGNING_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build installer
        run: tauri build
        env:
          MEDISMART_UPDATER_PUBLIC_KEY: ${{ secrets.MEDISMART_UPDATER_PUBLIC_KEY }}
          MEDISMART_UPDATER_ENDPOINT: ${{ secrets.MEDISMART_UPDATER_ENDPOINT }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medismart-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installers to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
