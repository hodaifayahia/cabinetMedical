name: browser-smoke-windows

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-smoke-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Laravel browser smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: fileinfo, gd, intl, mbstring, pdo_sqlite, sodium, sqlite3
          tools: composer:2.8.9
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.15.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        shell: pwsh
        run: |
          Copy-Item -LiteralPath .env.example -Destination .env
          php artisan key:generate --ansi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npm run test:e2e:install

      - name: Run browser smoke test
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_PORT: '4173'

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-windows-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
