name: desktop-runtime-windows

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Tauri runtime checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.15.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test release-resource fail-closed cases
        run: npm run desktop:resources:test

      - name: Validate the safe synthetic release-resource fixture
        run: npm run desktop:resources:fixture

      - name: Install the declared Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.84.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.84.0
          rustc --version
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test runtime core
        run: cargo test --manifest-path src-tauri/runtime-core/Cargo.toml

      - name: Test Tauri command and capability boundaries
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
