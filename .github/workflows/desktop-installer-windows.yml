name: desktop-installer-windows

# Builds the Drclick Windows desktop installer (NSIS .exe): the local-first,
# offline-capable application with its bundled PHP runtime, Laravel tree and
# empty SQLite template, staged by the stage-payload job. Uploads it as a
# workflow artifact; on tags (v*), also attaches it to a GitHub Release.

on:
  push:
    branches:
      - main
      - feature/hosted-multi-cabinet-desktop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-payload:
    # The offline payload (Windows PHP runtime, production Laravel tree, empty
    # migrated SQLite template: src-tauri/resources/README.md) is staged on
    # Linux, where stage-local-payload.mjs can run composer, unzip and artisan.
    # The Windows job only packages it; build.rs still refuses an installer
    # without it.
    name: Stage offline payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sodium, sqlite3, xml, zip
          tools: composer:2.8.9
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies for the asset build
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-ansi
          npm ci

      - name: Build production assets
        run: npm run build

      - name: Download and verify the Windows PHP runtime
        run: |
          set -euo pipefail
          curl -fsSL https://windows.php.net/downloads/releases/releases.json -o "$RUNNER_TEMP/php-releases.json"
          zip_path="$(jq -r '.["8.3"]["nts-vs16-x64"].zip.path' "$RUNNER_TEMP/php-releases.json")"
          zip_sha="$(jq -r '.["8.3"]["nts-vs16-x64"].zip.sha256' "$RUNNER_TEMP/php-releases.json")"
          [[ "$zip_path" =~ ^php-8\.3\.[0-9]+-nts-Win32-vs16-x64\.zip$ ]] || { echo "unexpected PHP build: $zip_path"; exit 1; }
          [[ "$zip_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "no checksum published for $zip_path"; exit 1; }
          curl -fsSL "https://windows.php.net/downloads/releases/$zip_path" -o "$RUNNER_TEMP/php-windows.zip"
          echo "PHP_WINDOWS_ZIP=$RUNNER_TEMP/php-windows.zip" >> "$GITHUB_ENV"
          echo "PHP_WINDOWS_SHA256=$zip_sha" >> "$GITHUB_ENV"
          echo "Windows PHP runtime: $zip_path"

      - name: Stage the offline payload
        # stage-local-payload.mjs compares the checksum before extracting.
        run: node scripts/desktop/stage-local-payload.mjs --php-zip "$PHP_WINDOWS_ZIP" --php-sha256 "$PHP_WINDOWS_SHA256" --skip-assets

      - name: Upload the offline payload
        uses: actions/upload-artifact@v6
        with:
          name: drclick-offline-payload
          path: |
            src-tauri/resources/php
            src-tauri/resources/laravel
            src-tauri/resources/initial
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  build-installer:
    name: Build Windows installer
    needs: stage-payload
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tauriConfig = Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json
          $desktopVersion = [string] $tauriConfig.version

          if ([string]::IsNullOrWhiteSpace($desktopVersion)) {
            throw 'src-tauri/tauri.conf.json must contain a nonempty version.'
          }

          $expectedTag = "v$desktopVersion"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must exactly match desktop version '$expectedTag'."
          }

      - name: Download the offline payload
        uses: actions/download-artifact@v7
        with:
          name: drclick-offline-payload
          path: src-tauri/resources

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-win-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build signed installer
        shell: pwsh
        env:
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MEDISMART_UPDATER_PUBLIC_KEY: ${{ secrets.MEDISMART_UPDATER_PUBLIC_KEY }}
          # Public URL, not a secret: the secret only overrides it (staging,
          # a reseller). Without a value the build refuses to run at all.
          MEDISMART_UPDATER_ENDPOINT: ${{ secrets.MEDISMART_UPDATER_ENDPOINT || 'https://drclickdz.com/desktop-updates/' }}
          # Google OAuth "Desktop app" client for the per-cabinet Drive backup.
          # Optional: when unset the installer still builds and the app reports
          # Drive backup as unavailable. build.rs validates and bakes them in.
          DRCLICK_GOOGLE_CLIENT_ID: ${{ secrets.DRCLICK_GOOGLE_CLIENT_ID }}
          DRCLICK_GOOGLE_CLIENT_SECRET: ${{ secrets.DRCLICK_GOOGLE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ephemeralKeyPath = $null

          if ([string]::IsNullOrWhiteSpace($env:DRCLICK_GOOGLE_CLIENT_ID)) {
            Write-Warning 'DRCLICK_GOOGLE_CLIENT_ID is not configured: this installer cannot back up clinics to Google Drive.'
          }

          try {
            $hasCompleteSigningSecrets =
              -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -and
              -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) -and
              -not [string]::IsNullOrWhiteSpace($env:MEDISMART_UPDATER_PUBLIC_KEY)

            if (-not $hasCompleteSigningSecrets) {
              if ($env:IS_TAG_RELEASE -eq 'true') {
                throw 'Tagged releases require TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and MEDISMART_UPDATER_PUBLIC_KEY secrets.'
              }

              Write-Warning 'Complete updater signing secrets are not configured. Generating an ephemeral keypair for this validation build only.'
              $ephemeralKeyPath = Join-Path $env:RUNNER_TEMP "medismart-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.key"
              $privateKeyPassword = [guid]::NewGuid().ToString('N')

              npx --no-install tauri signer generate `
                --write-keys $ephemeralKeyPath `
                --password $privateKeyPassword `
                --ci
              if ($LASTEXITCODE -ne 0) {
                throw "Tauri updater key generation failed with exit code $LASTEXITCODE."
              }

              $privateKey = (Get-Content -Raw $ephemeralKeyPath).Trim()
              $publicKey = (Get-Content -Raw "$ephemeralKeyPath.pub").Trim()
            } else {
              $privateKey = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
              $privateKeyPassword = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              $publicKey = $env:MEDISMART_UPDATER_PUBLIC_KEY.Trim()
            }

            if ([string]::IsNullOrWhiteSpace($privateKeyPassword)) {
              throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be nonempty for release builds.'
            }
            if ($publicKey.Length -lt 80 -or $publicKey -notmatch '^[A-Za-z0-9+/=]+$') {
              throw 'MEDISMART_UPDATER_PUBLIC_KEY must be a single-line base64 Tauri updater public key.'
            }

            Write-Output "::add-mask::$privateKey"
            Write-Output "::add-mask::$privateKeyPassword"

            $env:TAURI_SIGNING_PRIVATE_KEY = $privateKey
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $privateKeyPassword
            $env:MEDISMART_UPDATER_PUBLIC_KEY = $publicKey

            npm run desktop:build
            if ($LASTEXITCODE -ne 0) {
              throw "Tauri installer build failed with exit code $LASTEXITCODE."
            }
          } finally {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue

            if ($null -ne $ephemeralKeyPath) {
              Remove-Item -LiteralPath $ephemeralKeyPath -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath "$ephemeralKeyPath.pub" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: drclick-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish-release:
    name: Publish tagged Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          name: drclick-windows-installer
          path: release-artifacts

      - name: Attach installers to release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            release-artifacts/msi/*.msi
            release-artifacts/msi/*.sig
            release-artifacts/nsis/*.exe
            release-artifacts/nsis/*.sig
